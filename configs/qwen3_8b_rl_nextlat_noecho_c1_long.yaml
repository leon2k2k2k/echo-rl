# Long 8-GPU NextLat-only coefficient ablation.
# SFT-like outer scale: 1.0 * (0.3*MSE + 0.3*KL), with base gradients
# gated to verifier-correct trajectories.

data:
  train_data:
    - name: terminal_agent_train
      path: ${oc.env:TERMINAL_AGENT_TRAIN_PARQUET}
  val_data:
    - name: terminal_agent_train
      path: ${oc.env:TERMINAL_AGENT_VAL_PARQUET}

tokenizer_path: ${oc.env:QWEN3_8B_MODEL_PATH,Qwen/Qwen3-8B}
chat_template_path: echo_rl/terminal_agent/chat_templates/qwen3_xml_tool_calling.jinja

trainer:
  placement:
    colocate_all: true
    colocate_policy_ref: true
    policy_num_nodes: 1
    policy_num_gpus_per_node: 4
    ref_num_nodes: 1
    ref_num_gpus_per_node: 4
  policy:
    model:
      path: ${oc.env:QWEN3_8B_MODEL_PATH,Qwen/Qwen3-8B}
    optimizer_config:
      lr: 1.0e-6
      adam_betas: [0.9, 0.999]
      weight_decay: 0.01
      max_grad_norm: 0.2
      scheduler: constant_with_warmup
      num_warmup_steps: 20
  algorithm:
    max_seq_len: 24576
    use_kl_loss: false
    use_kl_in_reward: false
    kl_loss_coef: 0.0
    eps_clip_low: 0.2
    eps_clip_high: 0.2
    advantage_batch_normalize: false
    loss_reduction: sequence_mean
    world_model_coeff: 0.0
    nextlat_coeff: 1.0
    nextlat_base_reward_gate: true
    nextlat_lambda_mse: 0.3
    nextlat_lambda_kl: 0.3
    nextlat_lambda_ce: 0.0
    nextlat_token_loss_chunk_size: 32
    nextlat_mtp_horizon: 1
    nextlat_lr: 2.0e-5
    world_loss_normalization: full_observation_tokens
  epochs: 1
  update_epochs_per_batch: 1
  max_prompt_length: 1536
  train_batch_size: 1
  policy_mini_batch_size: 1
  micro_train_batch_size_per_gpu: 1
  micro_forward_batch_size_per_gpu: 1
  eval_batch_size: 16
  eval_before_train: false
  eval_interval: -1
  ckpt_interval: 20
  hf_save_interval: -1
  ckpt_path: ${oc.env:OUTPUT_DIR}/ckpts
  export_path: ${oc.env:OUTPUT_DIR}/exports
  log_path: ${oc.env:OUTPUT_DIR}/skyrl_logs
  logger: console
  project_name: world_model
  run_name: nextlat_noecho_c1_long
  log_example_interval: -1

generator:
  transcript_log_path: ${oc.env:OUTPUT_DIR}/terminal_transcripts.jsonl
  log_transcripts_to_console: false
  transcript_log_max_chars: 0
  n_samples_per_prompt: 8
  eval_n_samples_per_prompt: 8
  step_wise_trajectories: false
  parser_name: qwen35
  command_selection: first
  max_turns: 16
  max_context_tokens: 16384
  max_tokens_per_generation: 2048
  max_terminal_output_chars: 0
  terminal_output_truncation: start_end
  add_format_warn: true
  world_loss_target: env_only
  nextlat_loss_target: all_completion
  thinking_handling: keep_all
  verifier_timeout: 60.0
  length_penalty_coef: 0.0
  length_penalty_threshold: 20000
  correct_threshold: 0.5
  max_total_tokens: 24576
  docker_memory_mb: 1024
  docker_cpus: 1
  base_temp_dir: ${oc.env:ECHO_RUNTIME_ROOT}/tmp/tbench
  agent_max_concurrency: 8
  agent_timeout: 300.0
  max_concurrent_builds: 4
  max_build_retries: 5
  dataset_num_workers: 4
  dataset_max_rows: 160
  eval_dataset_max_rows_per_source: 16
  sampling_params:
    max_generate_length: 2048
    temperature: 0.8
    logprobs: 0
  eval_sampling_params:
    max_generate_length: 2048
    temperature: 0.6
    logprobs: 0
  inference_engine:
    backend: vllm
    run_engines_locally: true
    num_engines: 4
    weight_sync_backend: nccl
    tensor_parallel_size: 1
    async_engine: true
    enforce_eager: false
    enable_prefix_caching: true
    enable_chunked_prefill: true
    gpu_memory_utilization: 0.8
    max_num_batched_tokens: 65536
    engine_init_kwargs:
      swap_space: 4
